services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: aicadastre
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/aicadastre
      JWT_SECRET_KEY: change-this-in-production
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - ./storage:/app/storage
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  db_data:
